name: publish-map
on:
  schedule:
    - cron: "7 14,22,4 * * *"
  workflow_dispatch:
  # Page-only changes go live straight away, reusing the forecast data already published
  # (no new forecast download, so the free Open-Meteo quota is untouched).
  push:
    branches: [main]
    paths: ["site/**"]
permissions:
  contents: write
concurrency:
  group: skyfire-map
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repo (page files)
        uses: actions/checkout@v4
        with:
          path: pub
          persist-credentials: false
      - name: Reuse the published forecast data (page-only update)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: old
          persist-credentials: false
      - name: Copy the published data into the new page
        if: github.event_name == 'push'
        run: cp -a old/data pub/site/data
      - name: Check out the private skyfire repo (read-only token)
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          repository: JustMoosinAround/skyfire
          token: ${{ secrets.SKY_ALERTS_READ_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - uses: actions/cache@v4
        if: github.event_name != 'push'
        with:
          path: app/.skyfield
          key: skyfield-de421
      - run: pip install ./app
        if: github.event_name != 'push'
      - name: Build forecast data
        if: github.event_name != 'push'
        # Exit 0 = success. Exit 1 (settings problem) or 2 (every map failed)
        # stops the job here, so nothing is published and the old page stays up.
        env:
          # Open-Meteo commercial plan (SkyFire Pro): when set, the customer API. Empty = free API.
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: |
          cd app
          skyfire publish-map --out ../pub/site/data
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          touch pub/site/.nojekyll
          mkdir -p /tmp/out && cp -a pub/site/. /tmp/out/
          cd /tmp/out
          git init -q && git checkout -q -b gh-pages
          git add -A && git -c user.name="skyfire-bot" -c user.email="actions@users.noreply.github.com" commit -qm "publish $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
