name: fetch-peaks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  peaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: mkdir -p site/assets && node tools/fetch-peaks.mjs
      - name: Commit the peak list
        run: |
          git config user.name "skyfire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/assets/peaks.json
          git diff --cached --quiet || git commit -m "Peak names from OpenStreetMap (ODbL)"
          git push
